name: CI

# Quality gate for every pull request and every push to main.
# Deployments are handled by Vercel's GitHub integration:
#   - pull requests  -> Preview deployment (unique URL per PR)
#   - merge to main  -> Production deployment (your domain)
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Placeholder values so the build runs without real secrets
      NEXT_PUBLIC_SITE_URL: https://example.com
      NEXT_PUBLIC_CONTACT_EMAIL: hello@example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
